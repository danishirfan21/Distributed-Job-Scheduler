spring:
  application:
    name: job-worker-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_PROPERTIES_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_PROPERTIES_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
    consumer:
      group-id: job-worker-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        allow.auto.create.topics: false
      auto-offset-reset: earliest
      max-poll-records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    # The auto-configured Kafka health indicator calls the broker's admin API on every
    # /actuator/health hit. During cluster startup (partition leader election, consumer
    # rebalancing) that call can be slow/fail for a while even though the app itself is
    # perfectly healthy, which would incorrectly fail liveness/readiness checks.
    kafka:
      enabled: false
    # EmailNotificationExecutor deliberately simulates sending (no real SMTP configured -
    # see README "Known Limitations"), so the auto-configured mail health indicator would
    # try to authenticate against smtp.gmail.com with no credentials on every health check
    # and fail permanently, not just transiently. Disabled since it doesn't reflect any
    # real capability this service is meant to provide.
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      worker-id: ${WORKER_ID:default}
    distribution:
      percentiles-histogram:
        job.execution.time: true

worker:
  id: ${WORKER_ID:worker-${random.uuid}}
  max-concurrent-jobs: 10
  heartbeat-interval-seconds: 30
  job-timeout-minutes: 30
